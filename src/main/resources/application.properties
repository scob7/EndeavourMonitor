#logging.level.com.rapidapps=DEBUG

application.name=@project.artifactId@
build.version=@project.version@
build.timestamp=@timestamp@

# Added to vscode launch args to it doesnt break the release builds
# VSCode running dev then default profiles
# see application-dev.properties
#spring.web.resources.static-locations=file:src/main/resources/static

server.port=7070
#spring.mvc.static-path-pattern=/static/**
spring.mvc.format.date-time=iso
server.servlet.register-default-servlet=true
server.error.include-stacktrace=NEVER
server.contextPath=/

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=@PSQL_URL@
spring.datasource.username=@PSQL_USER@
spring.datasource.password=@PSQL_PASSWORD@

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

#w1.mock=true